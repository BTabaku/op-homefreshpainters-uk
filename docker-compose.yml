version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: homefreshpainters-app
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
    working_dir: /var/www/html
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-homefreshpainters}
      DB_USERNAME: ${DB_USERNAME:-homefreshpainters}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8096:8000"
    entrypoint: "/usr/local/bin/start-laravel.sh"
    depends_on:
      - mysql
      - redis

  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ${DB_DATABASE:-homefreshpainters}
      MYSQL_USER: ${DB_USERNAME:-homefreshpainters}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "3310:3306"

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6380:6379"
