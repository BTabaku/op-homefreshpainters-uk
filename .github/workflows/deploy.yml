name: Deploy Home Fresh Painters

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - uses: actions/checkout@v4

      - name: Copy files to server
        run: |
          echo "${{ secrets.SERVER_SSH_KEY }}" > key
          chmod 600 key
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='vendor' \
            --exclude='storage/logs' \
            -e "ssh -i key -o StrictHostKeyChecking=no" \
            ./ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:~/projects/apps/homefreshpainters-uk/
          rm key

      - name: Deploy
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/projects/apps/homefreshpainters-uk
            chmod +x deploy.sh
            ./deploy.sh
